[project]
name = "fashion-store-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
# Chỉ package M0 thực sự dùng; package của nghiệp vụ thêm ở mốc dùng tới (02 mục 3)
dependencies = [
    "django>=5.2.18,<5.3",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "psycopg[binary,pool]>=3.2",
    "redis>=8.1.0",
    "celery>=5.6.3",
    "django-celery-beat>=2.9.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "structlog>=26.1.0",
    "django-structlog>=11.0.0",
    "sentry-sdk[django,celery]>=2.73.0",
    "gunicorn>=23.0",
    "phonenumbers>=9.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "mypy>=2.4.0",
    "django-stubs>=5.2,<5.3",
    "djangorestframework-stubs>=3.16",
    "import-linter>=2.15",
    "pytest>=9.0",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "factory-boy>=3.3.3",
    "coverage>=7.17.0",
    "pytest-cov>=7.0",
    "respx>=0.22",
    "time-machine>=2.19",
    "django-zeal>=2.3.0",
    "django-test-migrations>=1.5",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    # Cùng bản với hook commitizen trong .pre-commit-config.yaml
    "commitizen==4.19.3",
]

[tool.uv]
# Backend là ứng dụng, không build thành package; CI cài bằng `uv sync --locked --no-build`
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # sắp xếp import: stdlib → third-party → config, shared, modules
    "N",        # pep8-naming
    "UP",       # pyupgrade: cú pháp Python 3.14
    "B",        # flake8-bugbear
    "C4",       # comprehension gọn
    "SIM",      # đơn giản hoá code
    "DJ",       # flake8-django
    "DTZ",      # cấm datetime không có múi giờ
    "PT",       # style pytest
    "RUF",      # rule riêng của ruff
    "S",        # flake8-bandit: code nguy hiểm (eval, pickle, shell=True, SQL ghép chuỗi…)
]
# Lỗi đặt tên theo nghiệp vụ (`OutOfStock`, `RetryLater`), không bắt hậu tố Error (02 mục 6.1)
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Test được dùng assert và mật khẩu giả viết cứng. "**/" để khớp cả modules/<module>/tests/,
# không chỉ backend/tests/
"**/tests/**" = ["S101", "S105", "S106"]
"conftest.py" = ["S105", "S106"]
# Migration theo khuôn Django sinh ra: `dependencies`, `operations` là list ở mức class
"**/migrations/**" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["config", "shared", "modules"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

# `strict` chỉ đặt được ở mục chung, không đặt được theo module, nên liệt kê từng flag
# tương đương --strict cho các phần bắt buộc kiểu chặt (02 mục 9.1)
[[tool.mypy.overrides]]
module = ["modules.*.services.*", "modules.*.selectors.*", "modules.*.contracts"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
check_untyped_defs = true

# Celery, kombu và django-celery-beat không có type hints
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "django_celery_beat.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"

[tool.importlinter]
root_packages = ["shared", "modules", "config"]

# Contract `forbidden` giữa từng cặp module do scripts/gen_importlinter.py sinh (ticket 04)
[[tool.importlinter.contracts]]
name = "Thứ tự lớp giữa các module"
type = "layers"
layers = [
    "modules.notifications",
    "modules.ordering",
    "modules.inventory | modules.promotions",
    "modules.identity | modules.catalog | modules.payments | modules.shipping",
    "shared",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
