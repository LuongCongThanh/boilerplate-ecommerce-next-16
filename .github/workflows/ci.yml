# CI chính. Xem docs/architecture/11-git-workflow.md mục 3.4 và 6.
# Repo là public: chỉ dùng trigger pull_request, không bao giờ dùng pull_request_target.
name: CI

on:
  push:
    branches: [main, uat, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comment lên PR cần quyền ghi; kết quả đã có trong job summary
          GITLEAKS_ENABLE_COMMENTS: false

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # đọc tiêu đề PR
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6
        # Container chỉ sống trong job và chỉ mở trên localhost của runner,
        # nên không đặt mật khẩu thay vì viết cứng một mật khẩu vào workflow
        env:
          POSTGRES_USER: fashion
          POSTGRES_DB: fashion
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fashion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: valkey/valkey:8.1.11
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Giá trị giả cho CI; không commit file .env (08 mục 2.3)
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://fashion@localhost:5432/fashion
      REDIS_URL: redis://localhost:6379/0
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      PII_HMAC_KEYS: ci-pii-1:ci-pii-secret
      STOREFRONT_ORIGIN: http://localhost:3000
      BFF_SHARED_SECRET: ci-bff-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kiểm tra đã có backend chưa
        id: detect
        working-directory: .
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Chưa có backend/pyproject.toml, bỏ qua lint, test và pip-audit"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.detect.outputs.present == 'true'
        with:
          working-directory: backend
      - name: Cài dependency
        if: steps.detect.outputs.present == 'true'
        # --locked: lỗi nếu uv.lock lệch pyproject.toml; --no-build: chỉ cài wheel, không chạy setup script
        run: |
          uv sync --locked --no-build
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Các bước sau gọi thẳng công cụ trong .venv, không dùng `uv run` để không resolve hay build lại
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: |
          ruff check .
          ruff format --check .
          mypy .
          lint-imports
      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: pytest
      - name: pip-audit
        if: steps.detect.outputs.present == 'true'
        # pip-audit nằm trong nhóm dev của uv.lock, không cài bằng uvx (phiên bản không được khoá)
        run: pip-audit --strict
