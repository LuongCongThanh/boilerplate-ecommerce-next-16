# Cài một lần, chạy trong backend/: uv run pre-commit install (pre-commit nằm trong nhóm dev)
# Xem docs/architecture/11-git-workflow.md mục 3.4 và 8.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # mypy và import-linter cần môi trường của backend, nên chạy bằng uv trong backend/.
  # Khi chưa có backend/pyproject.toml (trước ticket 07) thì bỏ qua êm.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend 2>/dev/null && [ -f pyproject.toml ] || exit 0; uv run mypy .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: lint-imports
        name: import-linter (backend)
        entry: bash -c 'cd backend 2>/dev/null && [ -f pyproject.toml ] || exit 0; PYTHONUTF8=1 uv run lint-imports'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
